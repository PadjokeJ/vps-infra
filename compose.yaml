services:
  curlsite:
    build: ./curl-padjokej.dev
    hostname: curlsite
    restart: unless-stopped
    ports:
      - 8002:8002
  coursedle:
    build: ./coursedle/website
    hostname: coursedle
    restart: unless-stopped
    ports:
      - 8003:8003

  rythmo:
    build: ./pyrythmo
    hostname: rythmo
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - rythmo_stats:/app/stats
  
  caddy:
    image: caddy:2.11.2-alpine
    hostname: caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    volumes:
      - $PWD/caddy:/etc/caddy
      - $PWD/caddy/epfl.cc/index.html:/srv/index.html
      - caddy_data:/data

  website:
    image: caddy:2.11.2-alpine
    hostname: website
    restart: unless-stopped
    ports:
      - 8001:80
    volumes:
      - $PWD/website/:/srv
      - $PWD/website/caddy:/etc/caddy

  detek:
    build: ./roboDetekMouche
    hostname: robotkidetek
    restart: unless-stopped
    environment:
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN}
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
      - SERVERPORT=42295 #optional
    volumes:
      - /etc/wireguard/:/config
      - /lib/modules:/lib/modules #optional
    ports:
      - 42295:42295/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

volumes:
  caddy_data:
  rythmo_stats:
